{% extends "base.html" %}
{% block title %}Inscription — Rwazap News{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <p class="mini-cat" style="color:var(--primary)">Rwazap News</p>
        <h1>Inscription</h1>
        <p class="text-muted">Créez un compte, validé ensuite par un administrateur.</p>
        <form method="POST">
            <div class="mb-3">
                <label for="username">Nom d'utilisateur</label>
                <input id="username" type="text" name="username" class="form-control" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" class="form-control" required autocomplete="email">
            </div>
            <div class="mb-3">
                <label for="password">Mot de passe</label>
                <input id="password" type="password" name="password" class="form-control" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Créer un compte</button>
        </form>
        <p class="mt-3 text-center"><small>Déjà un compte ? <a href="{{ url_for('main.login') }}">Se connecter</a></small></p>
    </div>
</div>
{% endblock %}
